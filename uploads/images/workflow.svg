<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="360" viewBox="0 0 1320 360" role="img" aria-labelledby="title desc"><title id="title">From search to a reusable file</title><desc id="desc">Search Commons, review the file details, create a reference, download, and keep the provenance record. Example commands use the Discogs icon.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#006699"/></marker><clipPath id="clip"><rect width="1320" height="360" rx="12"/></clipPath></defs><g clip-path="url(#clip)"><rect width="1320" height="360" fill="#09090b"/><rect width="1320" height="360" fill="url(#grid)"/><g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"><text x="26" y="32" fill="#fafafa" font-size="17" font-weight="700" letter-spacing="-.02em">from search to a reusable file</text><rect x="26" y="63" width="238" height="265" rx="16" fill="#111113" stroke="#27272a"/><circle cx="54" cy="94" r="16" fill="#006699"/><text x="54" y="99" text-anchor="middle" fill="#fafafa" font-size="12" font-weight="700">01</text><g fill="none" stroke="#006699" stroke-width="2.5" stroke-linecap="round"><circle cx="231" cy="95" r="9"/><path d="m238 102 7 7"/></g><text x="44" y="144" fill="#86bbd0" font-size="11" font-weight="700" letter-spacing="1.5">SEARCH</text><text x="44" y="172" fill="#fafafa" font-size="16" font-weight="700" letter-spacing="-.02em">Find a file</text><text x="44" y="198" fill="#fafafa" fill-opacity=".72" font-size="12">Search Commons and</text><text x="44" y="215" fill="#fafafa" fill-opacity=".72" font-size="12">choose a result.</text><rect x="38" y="229" width="214" height="84" rx="6" fill="#19191c" stroke="#27272a"/><text x="47" y="249" fill="#86bbd0" font-size="11">$</text><text xml:space="preserve" x="61" y="249" fill="#fafafa" font-size="11">wikimedia \</text><text xml:space="preserve" x="61" y="267" fill="#fafafa" font-size="11">  "Discogs logo"</text><path d="M267 187H278" stroke="#006699" stroke-width="2" marker-end="url(#arrow)"/><rect x="283" y="63" width="238" height="265" rx="16" fill="#111113" stroke="#27272a"/><circle cx="311" cy="94" r="16" fill="#006699"/><text x="311" y="99" text-anchor="middle" fill="#fafafa" font-size="12" font-weight="700">02</text><g fill="none" stroke="#006699" stroke-width="2.2" stroke-linejoin="round"><path d="M478 81h16l9 9v28h-25zM494 81v10h9M484 97h12M484 104h12"/></g><text x="301" y="144" fill="#86bbd0" font-size="11" font-weight="700" letter-spacing="1.5">REVIEW</text><text x="301" y="172" fill="#fafafa" font-size="16" font-weight="700" letter-spacing="-.02em">Check the details</text><text x="301" y="198" fill="#fafafa" fill-opacity=".72" font-size="12">Review creator, licence,</text><text x="301" y="215" fill="#fafafa" fill-opacity=".72" font-size="12">source and restrictions.</text><rect x="295" y="229" width="214" height="84" rx="6" fill="#19191c" stroke="#27272a"/><text x="304" y="249" fill="#86bbd0" font-size="11">$</text><text xml:space="preserve" x="318" y="249" fill="#fafafa" font-size="11">wikimedia info \</text><text xml:space="preserve" x="318" y="267" fill="#fafafa" font-size="11">  "File:Discogs icon.svg"</text><path d="M524 187H535" stroke="#006699" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="63" width="238" height="265" rx="16" fill="#111113" stroke="#27272a"/><circle cx="568" cy="94" r="16" fill="#006699"/><text x="568" y="99" text-anchor="middle" fill="#fafafa" font-size="12" font-weight="700">03</text><g fill="none" stroke="#006699" stroke-width="2.2" stroke-linecap="round"><path d="M745 81v9m-17 4h34m-30 0v16m26-16v16m-26 0h7m-7 0h-6m32 0h-7m7 0h6"/><circle cx="745" cy="81" r="3" fill="#990000" stroke="none"/></g><text x="558" y="144" fill="#86bbd0" font-size="11" font-weight="700" letter-spacing="1.5">CHOOSE</text><text x="558" y="172" fill="#fafafa" font-size="16" font-weight="700" letter-spacing="-.02em">Pick an output</text><text x="558" y="198" fill="#fafafa" fill-opacity=".72" font-size="12">Create a Markdown</text><text x="558" y="215" fill="#fafafa" fill-opacity=".72" font-size="12">reference; try html or url.</text><rect x="552" y="229" width="214" height="84" rx="6" fill="#19191c" stroke="#27272a"/><text x="561" y="249" fill="#86bbd0" font-size="11">$</text><text xml:space="preserve" x="575" y="249" fill="#fafafa" font-size="11">wikimedia md \</text><text xml:space="preserve" x="575" y="267" fill="#fafafa" font-size="11">  "File:Discogs icon.svg"</text><path d="M781 187H792" stroke="#006699" stroke-width="2" marker-end="url(#arrow)"/><rect x="797" y="63" width="238" height="265" rx="16" fill="#111113" stroke="#27272a"/><circle cx="825" cy="94" r="16" fill="#006699"/><text x="825" y="99" text-anchor="middle" fill="#fafafa" font-size="12" font-weight="700">04</text><g fill="none" stroke="#006699" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1002 81v23m-9-9 9 9 9-9M990 111h24"/></g><text x="815" y="144" fill="#86bbd0" font-size="11" font-weight="700" letter-spacing="1.5">USE</text><text x="815" y="172" fill="#fafafa" font-size="16" font-weight="700" letter-spacing="-.02em">Take action</text><text x="815" y="198" fill="#fafafa" fill-opacity=".72" font-size="12">Download the file or</text><text x="815" y="215" fill="#fafafa" fill-opacity=".72" font-size="12">copy a reference.</text><rect x="809" y="229" width="214" height="84" rx="6" fill="#19191c" stroke="#27272a"/><text x="818" y="249" fill="#86bbd0" font-size="11">$</text><text xml:space="preserve" x="832" y="249" fill="#fafafa" font-size="11">wikimedia d --out \</text><text xml:space="preserve" x="832" y="267" fill="#fafafa" font-size="11">  ./assets \</text><text xml:space="preserve" x="832" y="285" fill="#fafafa" font-size="11">  "File:Discogs icon.svg"</text><path d="M1038 187H1049" stroke="#006699" stroke-width="2" marker-end="url(#arrow)"/><rect x="1054" y="63" width="238" height="265" rx="16" fill="#111113" stroke="#27272a"/><circle cx="1082" cy="94" r="16" fill="#006699"/><text x="1082" y="99" text-anchor="middle" fill="#fafafa" font-size="12" font-weight="700">05</text><g fill="none" stroke="#006699" stroke-width="2.2" stroke-linejoin="round"><path d="M1247 80h24v31h-24zM1252 88h14m-14 7h14m-14 7h10"/><path d="M1243 86v30h24" stroke="#990000"/></g><text x="1072" y="144" fill="#86bbd0" font-size="11" font-weight="700" letter-spacing="1.5">KEEP</text><text x="1072" y="172" fill="#fafafa" font-size="16" font-weight="700" letter-spacing="-.02em">Retain provenance</text><text x="1072" y="198" fill="#fafafa" fill-opacity=".72" font-size="12">Keep the JSON sidecar</text><text x="1072" y="215" fill="#fafafa" fill-opacity=".72" font-size="12">with downloaded media.</text><rect x="1066" y="229" width="214" height="84" rx="6" fill="#19191c" stroke="#27272a"/><text xml:space="preserve" x="1074" y="249" fill="#fafafa" font-size="11">Source details</text><text xml:space="preserve" x="1074" y="267" fill="#fafafa" font-size="11">+ SHA-256</text></g></g><rect x=".5" y=".5" width="1319" height="359" rx="11.5" fill="none" stroke="#27272a"/></svg>